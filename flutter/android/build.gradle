// The plugin's native side, in Java on purpose: it builds with whatever Kotlin version the app uses.
group 'net.scruter.flutter.cmp'
version '1.0.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.3.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    // Its own namespace: beside scruter_flutter (net.scruter.flutter), no class of one hides the other's.
    if (project.android.hasProperty('namespace')) {
        namespace 'net.scruter.flutter.cmp'
    }
    compileSdk 34

    defaultConfig {
        minSdk 24
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation 'net.scruter.cmp:scruter-cmp:1.0.0'
}
