name: scruter_cmp_flutter
description: >-
  Scruter CMP for Flutter: the native consent sheet of Scruter CMP on iOS and Android, the proof of every choice,
  Google Consent Mode and the IAB TCF, without a device identifier.
version: 1.0.0
homepage: https://scruter.net/cmp
repository: https://github.com/scruter-analytics/scruter-cmp-mobile/tree/main/flutter
issue_tracker: https://github.com/scruter-analytics/scruter-cmp-mobile/issues
documentation: https://github.com/scruter-analytics/scruter-cmp-mobile/blob/main/flutter/README.md
topics: [consent, gdpr, cmp, privacy, tcf]

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: net.scruter.flutter.cmp
        pluginClass: ScruterCMPFlutterPlugin
      ios:
        pluginClass: ScruterCMPFlutterPlugin
